<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SCR-001 ログイン</title>
  <link rel="stylesheet" href="../wireframe.css">
</head>
<body>

  <section class="screen" data-title="通常">
    <strong data-no="1">ポモドーロタイマー</strong>

    <h1 data-no="2">ログイン</h1>

    <p class="error" data-no="3">ID またはパスワードが正しくありません</p>

    <div class="field"><label data-no="4">ID（必須）</label><div data-no="5"><input type="text"></div><small class="error" data-no="6">IDを入力してください</small></div>

    <div class="field"><label data-no="7">パスワード（必須）</label><div data-no="8"><input type="password"></div><small class="error" data-no="9">パスワードを入力してください</small></div>

    <div class="row">
      <button class="primary" data-no="10">ログイン</button>
    </div>
  </section>

</body>
</html>
