<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SCR-002 タイマー</title>
  <link rel="stylesheet" href="../wireframe.css">
</head>
<body>

  <section class="screen" data-title="通常（作業フェーズ・開始前）">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a class="active">タイマー</a><a>タスク管理</a><a>履歴</a><a>設定</a></span>
    </header>
    <div class="stack center">
      <span class="huge" data-no="1">25:00</span>
      <span class="dots" data-no="2"><span class="dot done"></span><span class="dot done"></span><span class="dot"></span><span class="dot"></span></span>
      <div class="row center"><button class="round" data-no="4">▶</button><button class="plain" data-no="5">▶|</button></div>
    </div>

    <div class="field"><label data-no="6">作業するタスク</label><div class="row"><span class="swatch t1" data-no="7"></span><div class="grow" data-no="8"><select><option>タスクなし</option><option selected>仕様書を書く</option><option>画面設計</option></select></div></div></div>
  </section>

  <section class="screen" data-title="作業フェーズ・動作中">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a class="active">タイマー</a><a>タスク管理</a><a>履歴</a><a>設定</a></span>
    </header>
    <div class="stack center">
      <span class="huge">24:52</span>
      <span class="dots"><span class="dot done"></span><span class="dot done"></span><span class="dot current"></span><span class="dot"></span></span>
      <div class="row center"><button class="plain" data-no="3">↺</button><button class="round" data-no="9">||</button><button class="plain">▶|</button></div>
    </div>

    <div class="field"><label>作業するタスク</label><div class="row"><span class="swatch t1"></span><div class="grow"><select disabled><option>タスクなし</option><option selected>仕様書を書く</option><option>画面設計</option></select></div></div></div>
  </section>

  <section class="screen" data-title="作業フェーズ・一時停止中">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a class="active">タイマー</a><a>タスク管理</a><a>履歴</a><a>設定</a></span>
    </header>
    <div class="stack center">
      <span class="huge">24:52</span>
      <span class="dots"><span class="dot done"></span><span class="dot done"></span><span class="dot current"></span><span class="dot"></span></span>
      <div class="row center"><button class="plain">↺</button><button class="round" data-no="10">▶</button><button class="plain">▶|</button></div>
    </div>

    <div class="field"><label>作業するタスク</label><div class="row"><span class="swatch t1"></span><div class="grow"><select disabled><option>タスクなし</option><option selected>仕様書を書く</option><option>画面設計</option></select></div></div></div>
  </section>

  <section class="screen rest" data-title="休憩フェーズ・動作中">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a class="active">タイマー</a><a>タスク管理</a><a>履歴</a><a>設定</a></span>
    </header>
    <div class="stack center">
      <span class="huge">04:30</span>
      <span class="dots"><span class="dot done"></span><span class="dot done"></span><span class="dot done"></span><span class="dot"></span></span>
      <div class="row center"><button class="plain">↺</button><button class="round">||</button><button class="plain">▶|</button></div>
    </div>

    <div class="field"><label>作業するタスク</label><div class="row"><span class="swatch t1"></span><div class="grow"><select><option>タスクなし</option><option selected>仕様書を書く</option><option>画面設計</option></select></div></div></div>
  </section>

</body>
</html>
