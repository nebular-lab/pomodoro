<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SCR-002 タイマー</title>
  <link rel="stylesheet" href="../wireframe.css">
</head>
<body>

  <section class="screen" data-title="通常（作業フェーズ・開始前）">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a class="active">タイマー</a><a>タスク管理</a><a>履歴</a><a>設定</a></span>
    </header>
    <p class="error" data-no="1">通信に失敗しました。時間をおいてもう一度お試しください</p>

    <div class="stack center">
      <span class="huge" data-no="2">25:00</span>
      <span class="dots" data-no="3"><span class="dot done"></span><span class="dot done"></span><span class="dot"></span><span class="dot"></span></span>
      <div class="row center"><button class="round" data-no="5">▶</button></div>
    </div>

    <div class="field"><label data-no="7">作業するタスク</label><div class="row"><span class="swatch t1" data-no="8"></span><div class="grow" data-no="9"><select><option>タスクなし</option><option selected>仕様書を書く</option><option>画面設計</option></select></div></div></div>
  </section>

  <section class="screen" data-title="作業フェーズ・動作中">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a class="active">タイマー</a><a>タスク管理</a><a>履歴</a><a>設定</a></span>
    </header>
    <div class="stack center">
      <span class="huge">24:52</span>
      <span class="dots"><span class="dot done"></span><span class="dot done"></span><span class="dot current"></span><span class="dot"></span></span>
      <div class="row center"><button class="plain" data-no="4">↺</button><button class="round" data-no="10">||</button><button class="plain" data-no="6">▶|</button></div>
    </div>

    <div class="field"><label>作業するタスク</label><div class="row"><span class="swatch t1"></span><div class="grow"><select disabled><option>タスクなし</option><option selected>仕様書を書く</option><option>画面設計</option></select></div></div></div>
  </section>

  <section class="screen" data-title="作業フェーズ・一時停止中">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a class="active">タイマー</a><a>タスク管理</a><a>履歴</a><a>設定</a></span>
    </header>
    <div class="stack center">
      <span class="huge">24:52</span>
      <span class="dots"><span class="dot done"></span><span class="dot done"></span><span class="dot current"></span><span class="dot"></span></span>
      <div class="row center"><button class="plain">↺</button><button class="round" data-no="11">▶</button><button class="plain">▶|</button></div>
    </div>

    <div class="field"><label>作業するタスク</label><div class="row"><span class="swatch t1"></span><div class="grow"><select><option>タスクなし</option><option selected>仕様書を書く</option><option>画面設計</option></select></div></div></div>
  </section>

  <section class="screen rest" data-title="休憩フェーズ・動作中">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a class="active">タイマー</a><a>タスク管理</a><a>履歴</a><a>設定</a></span>
    </header>
    <div class="stack center">
      <span class="huge">04:30</span>
      <span class="dots"><span class="dot done"></span><span class="dot done"></span><span class="dot done"></span><span class="dot"></span></span>
      <div class="row center"><button class="plain">↺</button><button class="round">||</button><button class="plain">▶|</button></div>
    </div>

    <div class="field"><label>作業するタスク</label><div class="row"><span class="swatch t1"></span><div class="grow"><select><option>タスクなし</option><option selected>仕様書を書く</option><option>画面設計</option></select></div></div></div>
  </section>

  <section class="screen" data-title="読み込み中">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a class="active">タイマー</a><a>タスク管理</a><a>履歴</a><a>設定</a></span>
    </header>
    <div class="note" data-no="12">読み込み中（タイマーの位置にスピナーを表示）</div>
  </section>

  <section class="screen" data-title="エラー">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a class="active">タイマー</a><a>タスク管理</a><a>履歴</a><a>設定</a></span>
    </header>
    <p class="error" data-no="13">タイマーを読み込めませんでした。</p>
    <div class="row"><button data-no="14">再読み込み</button></div>
  </section>

</body>
</html>
