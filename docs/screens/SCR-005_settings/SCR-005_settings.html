<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SCR-005 設定</title>
  <link rel="stylesheet" href="../wireframe.css">
</head>
<body>

  <section class="screen" data-title="通常">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a>タイマー</a><a>タスク管理</a><a>履歴</a><a class="active">設定</a></span>
    </header>
    <h1 data-no="1">設定</h1>

    <div class="cols-2">
      <div class="field"><label data-no="2">作業時間</label><div data-no="3"><select><option>5 分</option><option>10 分</option><option>15 分</option><option>20 分</option><option selected>25 分</option><option>30 分</option><option>…</option><option>120 分</option></select></div></div>
      <div class="field"><label data-no="4">小休憩時間</label><div data-no="5"><select><option selected>5 分</option><option>10 分</option><option>15 分</option><option>…</option><option>60 分</option></select></div></div>
    </div>

    <div class="cols-2">
      <div class="field"><label data-no="6">長休憩時間</label><div data-no="7"><select><option>5 分</option><option>10 分</option><option selected>15 分</option><option>…</option><option>60 分</option></select></div></div>
      <div class="field"><label data-no="8">サイクル</label><div data-no="9"><select><option>1 回</option><option>2 回</option><option>3 回</option><option selected>4 回</option><option>…</option><option>10 回</option></select></div></div>
    </div>

    <label class="check" data-no="10"><input type="checkbox">休憩を自動スタートする</label>

    <label class="check" data-no="11"><input type="checkbox">作業を自動スタートする</label>
  </section>

</body>
</html>
