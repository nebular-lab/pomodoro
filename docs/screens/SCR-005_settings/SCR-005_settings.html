<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SCR-005 設定</title>
  <link rel="stylesheet" href="../wireframe.css">
</head>
<body>

  <section class="screen" data-title="通常">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a>タイマー</a><a>タスク管理</a><a>履歴</a><a class="active">設定</a></span>
    </header>
    <h1 data-no="1">設定</h1>

    <p class="error" data-no="2">通信に失敗しました。時間をおいてもう一度お試しください</p>

    <div class="cols-2">
      <div class="field"><label data-no="3">作業時間</label><div data-no="4"><select><option>5 分</option><option>10 分</option><option>15 分</option><option>20 分</option><option selected>25 分</option><option>30 分</option><option>…</option><option>120 分</option></select></div></div>
      <div class="field"><label data-no="5">小休憩時間</label><div data-no="6"><select><option selected>5 分</option><option>10 分</option><option>15 分</option><option>…</option><option>60 分</option></select></div></div>
    </div>

    <div class="cols-2">
      <div class="field"><label data-no="7">長休憩時間</label><div data-no="8"><select><option>5 分</option><option>10 分</option><option selected>15 分</option><option>…</option><option>60 分</option></select></div></div>
      <div class="field"><label data-no="9">サイクル</label><div data-no="10"><select><option>1 回</option><option>2 回</option><option>3 回</option><option selected>4 回</option><option>…</option><option>10 回</option></select></div></div>
    </div>

    <label class="check" data-no="11"><input type="checkbox">休憩を自動スタートする</label>

    <label class="check" data-no="12"><input type="checkbox">作業を自動スタートする</label>

    <div class="spacer"></div>

    <div class="row">
      <button data-no="13">ログアウト</button>
    </div>
  </section>

  <section class="screen" data-title="読み込み中">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a>タイマー</a><a>タスク管理</a><a>履歴</a><a class="active">設定</a></span>
    </header>
    <h1>設定</h1>
    <div class="note" data-no="14">読み込み中（入力欄の位置にスピナーを表示）</div>
  </section>

  <section class="screen" data-title="エラー">
    <header class="row between">
      <strong>ポモドーロタイマー</strong>
      <span class="row"><a>タイマー</a><a>タスク管理</a><a>履歴</a><a class="active">設定</a></span>
    </header>
    <h1>設定</h1>
    <p class="error" data-no="15">設定を読み込めませんでした。</p>
    <div class="row"><button data-no="16">再読み込み</button></div>
  </section>

</body>
</html>
